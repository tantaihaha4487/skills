    <text x="734" y="277" fill="#efc8f0" font-size="21" font-weight="700">Documents &amp; study sheets</text>
    <text x="674" y="328" fill="#eae6f4" font-size="19">Thai DOCX / PDF documents</text>
    <text x="674" y="363" fill="#eae6f4" font-size="19">Black-and-white grid cram sheets</text>
